<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Box3D Samples</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1e;
        }
        canvas#canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #9a9aa0;
            font: 14px/1.5 -apple-system, system-ui, sans-serif;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="status">Loading&hellip;</div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <script>
        var statusElement = document.getElementById('status');

        if (!navigator.gpu) {
            statusElement.innerHTML = 'This demo needs WebGPU, which this browser does not offer.';
        }
        if (!crossOriginIsolated) {
            statusElement.innerHTML =
                'Not cross-origin isolated: SharedArrayBuffer is unavailable.<br>' +
                'Serve with COOP/COEP headers, e.g. <code>emrun samples.html</code>.';
        }

        var Module = {
            canvas: document.getElementById('canvas'),
            onRuntimeInitialized: function () {
                statusElement.style.display = 'none';
            },
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
